name: Process Emojis

on:
  push:
    paths:
      - 'input/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process emojis
        run: node scripts/process-emojis.cjs

      - name: Commit changes
        run: |
          git config user.name "emoji-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "auto: update emojis"
          git push